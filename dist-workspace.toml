[workspace]
members = ["cargo:."]

[dist]
cargo-dist-version = "0.32.0"
ci = "github"
installers = ["shell"]
targets = ["aarch64-unknown-linux-gnu", "aarch64-unknown-linux-musl", "armv7-unknown-linux-gnueabihf", "armv7-unknown-linux-musleabihf", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
install-path = "CARGO_HOME"
install-updater = false
simple-download-url = "https://releases.gnu.foo/rustdoc-query/{tag}"
hosting = ["simple", "github"]
changelog-style = "git-cliff"
# Keep the generated CI baseline while allowing the custom R2/KV release steps.
allow-dirty = ["ci"]
# Build only the required packages, and individually
precise-builds = true
