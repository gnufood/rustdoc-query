[package]
name = "rustdoc-query"
version = "0.1.0"
edition = "2021"
description = "Rust library and MCP server for querying crate public APIs from rustdoc JSON"
license = "MIT OR Apache-2.0"
rust-version = "1.91"
repository = "https://github.com/gnufood/rustdoc-query"
readme = "README.md"
documentation = "https://docs.rs/rustdoc-query"
keywords = ["mcp", "rustdoc", "api", "documentation", "code-search"]
categories = ["command-line-utilities", "development-tools"]

[workspace]
members = [".", "xtask"]
default-members = ["."]
resolver = "2"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[lib]
name = "rustdoc_query"
path = "src/lib.rs"

[[bin]]
name = "rustdoc-query"
path = "src/main.rs"

[dependencies]
# Core
rustdoc-types = "0.61"                                                            # format_version 61 pin
rmcp = { version = "1.7", features = ["server", "transport-io", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "sync", "fs"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] } # raw .zst: no zstd feature
moka = { version = "0.12", features = ["future"] }
zstd = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
schemars = "1"
sha2 = "0.10"

# Output
toon-format = { version = "0.5", default-features = false }                       # lib only: default=["cli"] pulls a TUI stack

# Cache sidecar
postcard = { version = "1", default-features = false, features = ["use-std"] }
tokio-rusqlite = { version = "0.7", features = ["bundled"] }

# Supporting
nucleo-matcher = "0.3"
thiserror = "2"
directories = "5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
semver = "1"

[lints]
workspace = true

[dev-dependencies]
jsonschema = { version = "0.53.0", default-features = false }
trybuild = "1"

[package.metadata.cargo-machete]
ignored = ["schemars"]

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
